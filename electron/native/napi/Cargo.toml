[package]
name = "pearpass-biometric-napi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "async"] }
napi-derive = "2"
pearpass-biometric-core = { path = "../core" }

[build-dependencies]
napi-build = "2"
